# FERN -- Supabase CLI configuration.
# Used by `supabase start` / `supabase db reset` for local development. A linked
# cloud project takes its settings from the dashboard, not from this file --
# only `project_id` and the migration layout matter there.

project_id = "fern"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Reports page through their own date ranges; this is the hard ceiling.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches outgoing mail locally: invites, magic links and password resets all
# land here instead of a real inbox.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# FERN is invite-only: hospital staff accounts are created by an administrator,
# never by self-service signup.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
