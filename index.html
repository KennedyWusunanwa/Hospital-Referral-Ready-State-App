<!doctype html>
<html lang="en" dir="ltr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout paint into the notch area; every
         edge that needs it pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Browser chrome follows the app's own light/dark surface. -->
    <meta name="theme-color" content="#1b5cf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="FERN - hospital emergency readiness and inter-hospital referral coordination."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Installed app behaviour: standalone window, no browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FERN" />
    <meta name="application-name" content="FERN" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#1b5cf5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FERN - Referral Ready State</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1 style="font-size: 1.125rem">JavaScript is required</h1>
        <p style="color: #475569">
          FERN needs JavaScript enabled to show live readiness and referral data.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
