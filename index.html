<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout paint into the notch area; every
         edge that needs it pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Browser chrome follows the app's own theme: src/lib/theme.ts rewrites
         this to the brand colour on light and the shell surface on dark. -->
    <meta name="theme-color" content="#1b5cf5" />

    <meta
      name="description"
      content="FERN - hospital emergency readiness and inter-hospital referral coordination."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Public origin. Update alongside VITE_APP_URL when the national domain replaces the Vercel host. -->
    <link rel="canonical" href="https://hospital-ref.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FERN" />
    <meta property="og:title" content="FERN - Referral Ready State" />
    <meta
      property="og:description"
      content="Know which hospital can take the patient before the ambulance moves."
    />
    <meta property="og:url" content="https://hospital-ref.vercel.app/" />
    <meta property="og:image" content="https://hospital-ref.vercel.app/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installed app behaviour: standalone window, no browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FERN" />
    <meta name="application-name" content="FERN" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FERN - Referral Ready State</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1 style="font-size: 1.125rem">JavaScript is required</h1>
        <p style="color: #475569">
          FERN needs JavaScript enabled to show live readiness and referral data.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
